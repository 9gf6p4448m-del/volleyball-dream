<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1c2230" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>排球夢 — Phase 1 單場對戰</title>
    <style>
      * {
        margin: 0; padding: 0; box-sizing: border-box;
        /* 遊戲頁全域禁文字選取/長按選單（iOS 長按=蓄力操作，不能跳出拷貝翻譯） */
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none;
      }
      html, body { height: 100%; overflow: hidden; background: #1c2230; touch-action: none; }
      #app canvas { display: block; touch-action: none; }
      #hud {
        position: fixed;
        top: env(safe-area-inset-top, 0);
        left: env(safe-area-inset-left, 0);
        padding: 10px 14px;
        color: #eef2fa;
        font-family: ui-monospace, Consolas, monospace;
        background: rgba(12, 16, 26, 0.55);
        border-bottom-right-radius: 10px;
        pointer-events: none;
        user-select: none;
        z-index: 10;
      }
      #hud .fps { font-size: 34px; font-weight: 700; line-height: 1.1; }
      #hud .fps span { font-size: 14px; font-weight: 400; opacity: 0.7; }
      #hud .stats { font-size: 12px; line-height: 1.5; white-space: pre-line; opacity: 0.9; }
      #hud .settings { font-size: 11px; margin-top: 4px; opacity: 0.6; }
      /* 極簡 HUD（預設遊玩模式）：只留小 FPS 角標；?hud=1 才是完整偵錯版 */
      #hud.hud-min { background: transparent; padding: 6px 10px; }
      #hud.hud-min .fps { font-size: 13px; font-weight: 600; opacity: 0.45; }
      #hud.hud-min .fps span { font-size: 10px; }
      #hud.hud-min .stats, #hud.hud-min .settings { display: none; }
      /* 錯誤訊息任何模式都要浮出 */
      #hud.hud-min .stats.hud-error {
        display: block; color: #ff8a8a;
        background: rgba(12, 16, 26, 0.85); padding: 4px 8px; border-radius: 8px;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 14px;
        align-items: center;
        justify-content: center;
        color: #eef2fa;
        font-family: system-ui, sans-serif;
        font-size: 18px;
        background: radial-gradient(ellipse at 50% 30%, #253048 0%, #1c2230 55%, #12161f 100%);
        z-index: 20;
        text-align: center;
      }
      /* 大作感二卷 批2：啟動畫面——金字 logo＋彈跳球＋脈動載入字（純 CSS，載入完成整塊 remove 行為不變） */
      #loading .ld-logo {
        font-size: clamp(34px, 10vw, 64px); font-weight: 900; letter-spacing: 0.14em;
        color: #ffd166; text-shadow: 0 0 26px rgba(255, 209, 102, 0.45), 0 2px 8px rgba(0,0,0,0.6);
      }
      #loading .ld-sub { font-size: clamp(11px, 3vw, 14px); letter-spacing: 0.5em; text-indent: 0.5em; opacity: 0.7; }
      #loading .ld-ball { font-size: 30px; animation: ldBounce 0.9s ease-in-out infinite; }
      #loading .ld-msg { font-size: 14px; opacity: 0.65; animation: ldPulse 1.6s ease-in-out infinite; }
      @keyframes ldBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
      @keyframes ldPulse { 0%, 100% { opacity: 0.65; } 50% { opacity: 0.25; } }
    </style>
    <script type="module" crossorigin src="./assets/index-J0ixhtuA.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/three-BgRU8ovt.js">
    <link rel="modulepreload" crossorigin href="./assets/sim-BJpEeMSg.js">
    <link rel="modulepreload" crossorigin href="./assets/ui-D2rwwwQR.js">
  <link rel="manifest" href="./manifest.webmanifest"></head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="loading"><div class="ld-logo">排球夢</div><div class="ld-sub">VOLLEYBALL DREAM</div><div class="ld-ball">🏐</div><div class="ld-msg">載入模型中…</div></div>
  </body>
</html>

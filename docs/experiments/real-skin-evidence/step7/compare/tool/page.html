<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>real-skin step7 compare</title>
<style>body{margin:0;background:#151b27}</style></head>
<body><canvas id="c" width="600" height="760"></canvas>
<script type="module">
// 燈光、地板、鏡頭公式照抄 step5/compare/tool/compare-page.html；網格＝dump.mjs 存的「該欄管線實際畫的」位置與法線，
// 以一般 Mesh＋與 src 同參數的 MeshStandardMaterial 畫（四欄同一條繪製路徑）。marks＝S14 δ 最大點（近拍才畫）
import * as THREE from 'three';
const W = 600; const H = 760;
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x151b27);
scene.add(new THREE.HemisphereLight(0xc8d6ff, 0x2a2f3a, 1.2));
const k = new THREE.DirectionalLight(0xfff1dc, 2.0); k.position.set(-3, 6, 4); scene.add(k);
const f = new THREE.DirectionalLight(0xdfe8ff, 0.9); f.position.set(4, 3, 3); scene.add(f);
const r = new THREE.DirectionalLight(0x9ec4ff, 0.8); r.position.set(3, 3, -4); scene.add(r);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), new THREE.MeshStandardMaterial({ color: 0x8a6a4b, roughness: 0.95 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
const camera = new THREE.PerspectiveCamera(34, W / H, 0.05, 50);
const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, vertexColors: true, roughness: 0.8, metalness: 0.02 });
const markMat = new THREE.MeshBasicMaterial({ color: 0xff2020, depthTest: false });
const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false, side: THREE.DoubleSide });
const bin = async (u, T) => new T(await (await fetch(u)).arrayBuffer());
async function shot(dir, col, keyId, cam, rootY, marks) {
  const b = `/@fs/${dir}/${col}-${keyId}`;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(await bin(`${b}.pos.bin`, Float32Array), 3));
  g.setAttribute('normal', new THREE.BufferAttribute(await bin(`${b}.nor.bin`, Float32Array), 3));
  g.setAttribute('color', new THREE.BufferAttribute(await bin(`${b}.col.bin`, Float32Array), 3));
  g.setIndex(new THREE.BufferAttribute(await bin(`${b}.idx.bin`, Uint32Array), 1));
  const mesh = new THREE.Mesh(g, mat); mesh.frustumCulled = false; scene.add(mesh);
  const extra = [];
  const c = cam;
  const az = (c.az * Math.PI) / 180; const el = (c.el * Math.PI) / 180;
  const ty = c.ty + rootY * 0.8; const tx = c.tx ?? 0; const tz = c.tz ?? 0;
  camera.position.set(tx + c.dist * Math.sin(az) * Math.cos(el), ty + c.dist * Math.sin(el), tz + c.dist * Math.cos(az) * Math.cos(el));
  camera.lookAt(tx, ty, tz); camera.updateProjectionMatrix();
  for (const m of marks || []) {
    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.009, 12, 8), markMat); dot.position.fromArray(m); dot.renderOrder = 10;
    const ring = new THREE.Mesh(new THREE.RingGeometry(0.018, 0.024, 24), ringMat); ring.position.fromArray(m); ring.lookAt(camera.position); ring.renderOrder = 10;
    scene.add(dot, ring); extra.push(dot, ring);
  }
  renderer.render(scene, camera);
  const url = renderer.domElement.toDataURL('image/png');
  scene.remove(mesh, ...extra); g.dispose();
  return { url };
}
window.__s = { shot, ready: true };
</script></body></html>

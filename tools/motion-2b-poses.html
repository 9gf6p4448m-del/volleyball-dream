<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2B 動作校準截圖台</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1119; overflow: hidden; }
  canvas { display: block; }
  #tag { position: fixed; left: 10px; top: 8px; color: #dfe6f2; font: 600 14px/1.3 system-ui, sans-serif; text-shadow: 0 1px 2px #000; }
</style>
</head>
<body>
<div id="tag"></div>
<script type="module">
// 寫實球員卷 2B · E7 並排對照的遊戲截圖台（tools/motion-2b-shots.mjs 驅動）。
// 用真實的 createGeoCharacter／createRealPlayer＋createGeoAnimator，照 D0 腳本的觸發鏈
// （tools/motion-d0-measure.mjs FRAME_DEFS）驅動到各技術的關鍵階段；只在 dev server 下使用，
// 不是正式遊戲畫面的一部分（正式比賽畫面的截圖屬 2A B12）。
import * as THREE from 'three';
import { createGeoAnimator, SEQ_HIT, hitLeadTicks } from '/src/render/geoAnimator.js';
import { createGeoPool, createGeoCharacter } from '/src/render/geoCharacter.js';
import { loadRealPlayerAsset, createRealPlayer } from '/src/render/realPlayer.js';

const TICK = 1 / 60;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x151b27);
scene.add(new THREE.HemisphereLight(0xc8d6ff, 0x2a2f3a, 1.1));
const key = new THREE.DirectionalLight(0xfff1dc, 2.2);
key.position.set(-3, 6, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -3, right: 3, top: 4, bottom: -1, near: 0.5, far: 20 });
scene.add(key);
const rim = new THREE.DirectionalLight(0x9ec4ff, 0.8);
rim.position.set(3, 3, -4);
scene.add(rim);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), new THREE.MeshStandardMaterial({ color: 0xc98a4b, roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);
// 網（參考方向）：角色面向 +Z，網在前方 0.8 m
const net = new THREE.Mesh(new THREE.BoxGeometry(4, 1, 0.02), new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.18 }));
net.position.set(0, 2.0, 0.8);
scene.add(net);
const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 50);

// 技術 → 觸發鏈（同 D0 FRAME_DEFS）與相機（角色面向 +Z、右手側在 −X）
const TECH = {
  bump: { label: '低手接球・觸球', cam: [-2.4, 1.0, 2.2], look: 0.85,
    drive: (a, run) => { a.trigger('receiveReady'); run('receiveReady', 0.3); a.trigger('bump'); run('bump', SEQ_HIT.bump * 0.5); } },
  set: { label: '高手舉球・出手', cam: [-1.3, 1.5, 3.0], look: 1.3,
    drive: (a, run) => { a.trigger('setReady'); run('setReady', 0.3); a.trigger('overhead'); run('overhead', SEQ_HIT.overhead * 0.55); } },
  spike: { label: '扣球・擊球', cam: [-3.1, 1.9, 0.9], look: 1.5,
    drive: (a, run, ticks) => { a.trigger('windup'); ticks(11); a.trigger('spike', { hitInTicks: hitLeadTicks('spike') }); run('spike', SEQ_HIT.spike * 0.45); } },
  spikeWind: { label: '扣球・最大引臂', cam: [-3.1, 1.9, 0.9], look: 1.5,
    drive: (a, run) => { a.trigger('windup'); run('spikeHold', 0.04); } },
  block: { label: '攔網・最高點', cam: [-1.6, 1.7, 3.1], look: 1.5,
    drive: (a, run, ticks) => { a.setHold('block'); ticks(6); a.trigger('blockJump'); run('blockJump', 0.2); } },
  servejump: { label: '跳發・擊球', cam: [-3.1, 1.9, 0.6], look: 1.5,
    drive: (a, run, ticks) => { a.setHold('serveReady'); ticks(6); a.trigger('serveJump'); run('serveJump', 0.4 * 0.85); } },
  servefloat: { label: '飄球・擊球', cam: [-3.1, 1.5, 0.6], look: 1.2,
    drive: (a, run, ticks) => { a.setHold('serveReady'); ticks(6); a.trigger('serveFloat'); run('serveFloat', 0.45 * 0.5); } },
  tip: { label: '吊球・觸球', cam: [-3.1, 1.9, 0.9], look: 1.5,
    drive: (a, run, ticks) => { a.trigger('windup'); ticks(12); a.trigger('tip', { hitInTicks: hitLeadTicks('tip') }); run('tip', SEQ_HIT.tip * 0.42); } },
};

let asset = null;
let current = null;
function clearCurrent() {
  if (!current) return;
  for (const o of current.objects) scene.remove(o);
  current = null;
}
function build(kind) {
  if (kind === 'geo') {
    const before = new Set(scene.children);
    const pool = createGeoPool(scene, true, 1);
    const rig = createGeoCharacter(pool, 'D0Probe', 'A', 1.85, false, 'D0Probe', null, null);
    pool.finishColors();
    const meshes = scene.children.filter((o) => !before.has(o));
    return {
      rig, objects: meshes,
      frame(bodyY) {
        rig.root.position.y = bodyY; rig.root.updateMatrixWorld(true);
        for (const part of rig.parts) pool.writeMatrix(part, part.node.matrixWorld);
        pool.markDirty();
      },
    };
  }
  const p = createRealPlayer(asset, { playerId: 'D0Probe', teamId: 'A', height: 1.85, name: 'D0Probe' });
  p.mesh.castShadow = true;
  scene.add(p.rig.root);
  scene.add(p.mesh);
  return {
    rig: p.rig, objects: [p.rig.root, p.mesh], pre() { p.resetLegs(); },
    frame(bodyY) { p.rig.root.position.y = bodyY * p.rig.root.scale.y; p.rig.root.updateMatrixWorld(true); p.groundLegs(); },
  };
}

async function show(tech, kind) {
  const T = TECH[tech];
  if (!T) throw new Error(`未知技術 ${tech}`);
  if (kind === 'real' && !asset) asset = await loadRealPlayerAsset('/models/real/player_20k.glb');
  clearCurrent();
  const c = build(kind);
  current = c;
  const anim = createGeoAnimator(c.rig);
  const step = (dt) => { c.pre?.(); const y = anim.update(dt, 0, 0, 1); c.frame(y); };
  const ticks = (n) => { for (let i = 0; i < n; i += 1) step(TICK); };
  const run = (type, tTarget) => {
    let guard = 0;
    while (anim.peek()?.type !== type) { step(TICK); if ((guard += 1) > 600) throw new Error(`等不到 ${type}`); }
    for (;;) {
      const remain = tTarget - anim.peek().t;
      if (remain <= 1e-9) break;
      step(Math.min(TICK, remain));
      if ((guard += 1) > 1200) throw new Error('run 過長');
    }
  };
  ticks(30);
  T.drive(anim, run, ticks);
  const pk = anim.peek();
  const W = innerWidth; const H = innerHeight;
  renderer.setSize(W, H);
  camera.aspect = W / H;
  const scale = W / H < 1 ? 1.9 : 1;
  const rootY = c.rig.root.position.y;
  camera.position.set(T.cam[0] * scale, T.cam[1] + rootY * 0.5, T.cam[2] * scale);
  camera.lookAt(0, T.look + rootY * 0.7, 0.1);
  camera.updateProjectionMatrix();
  document.getElementById('tag').textContent = `${T.label}｜${kind === 'geo' ? '幾何' : '寫實'}｜${pk?.type} t=${pk?.t.toFixed(3)}`;
  renderer.render(scene, camera);
  return { tech, kind, seq: pk?.type ?? null, t: pk?.t ?? null, tNorm: pk?.tNorm ?? null, rootY, label: T.label };
}
window.__poses = { show, techs: Object.keys(TECH) };
window.__posesReady = true;
</script>
</body>
</html>
